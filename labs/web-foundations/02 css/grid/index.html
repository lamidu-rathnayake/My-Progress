<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
</head>
<body>
    <div class="daw-workspace">
  
        <!-- Zone 1: Top Transport Bar -->
        <header class="top-bar">
            <button>Play</button>
            <button>Stop</button>
        </header>

        <!-- Zone 2: Left Track List -->
        <aside class="sidebar">
            <h3>Tracks</h3>
            <!-- Your Flexbox track header from earlier would eventually go inside here -->
        </aside>

        <!-- Zone 3: Main Timeline -->
        <main class="timeline">
            <h3>Timeline Area</h3>
        </main>

    </div>
</body>
</html>
